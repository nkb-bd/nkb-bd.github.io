<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'JetBrains Mono', ui-monospace, monospace" role="img" aria-labelledby="digTitle">
  <title id="digTitle">Two concurrent submissions race for the last unit; the guarded UPDATE lets only one win.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8578"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#faf8f3"/>
  <rect x="0.5" y="0.5" width="759" height="379" fill="none" stroke="#e7e3da" stroke-width="1"/>

  <text x="30" y="42" fill="#bb4620" font-size="12" letter-spacing="2">CONCURRENCY GUARD</text>
  <text x="30" y="66" fill="#33302a" font-size="14">remaining = 1 · two submissions arrive at once</text>

  <rect x="30" y="96" width="200" height="56" rx="4" fill="#fff" stroke="#c9c3b6" stroke-width="1.5"/>
  <text x="45" y="120" fill="#24211c" font-size="13" font-weight="600">Request A</text>
  <text x="45" y="140" fill="#78736b" font-size="11">qty = 1</text>

  <rect x="30" y="252" width="200" height="56" rx="4" fill="#fff" stroke="#c9c3b6" stroke-width="1.5"/>
  <text x="45" y="276" fill="#24211c" font-size="13" font-weight="600">Request B</text>
  <text x="45" y="296" fill="#78736b" font-size="11">qty = 1</text>

  <rect x="300" y="156" width="290" height="84" rx="4" fill="#fff" stroke="#bb4620" stroke-width="2"/>
  <text x="315" y="184" fill="#bb4620" font-size="13" font-weight="700">Atomic UPDATE</text>
  <text x="315" y="206" fill="#4a463f" font-size="11">SET remaining = remaining - qty</text>
  <text x="315" y="224" fill="#4a463f" font-size="11">WHERE remaining &#8805; qty</text>

  <path d="M230 124 C 270 136, 270 176, 300 188" fill="none" stroke="#8a8578" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M230 280 C 270 268, 270 226, 300 210" fill="none" stroke="#8a8578" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M590 184 C 650 168, 660 128, 690 118" fill="none" stroke="#8a8578" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M590 214 C 650 230, 660 270, 690 282" fill="none" stroke="#8a8578" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="697" y="108" width="10" height="10" fill="#bb4620"/>
  <text x="620" y="90" fill="#24211c" font-size="13" font-weight="600">1 row matched</text>
  <text x="612" y="138" fill="#bb4620" font-size="11">&#8594; claimed, entry stored</text>

  <rect x="697" y="277" width="10" height="10" fill="none" stroke="#a8a29a" stroke-width="1.5"/>
  <text x="620" y="258" fill="#4a463f" font-size="13">0 rows matched</text>
  <text x="612" y="306" fill="#78736b" font-size="11">&#8594; soldOut(), no oversell</text>

  <text x="30" y="356" fill="#78736b" font-size="11">The WHERE clause is the referee: only one UPDATE can match the row — the race resolves in the database, not in PHP.</text>
</svg>
